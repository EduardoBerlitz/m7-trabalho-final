<main class="container">
  <a routerLink="/livros">
    ← Voltar para livros
  </a>

  @if (carregando()) {
    <p>Carregando...</p>
  }
  @else if (livro(); as item) {
    <h1>{{ item.titulo }}</h1>

    <p>{{ item.descricao }}</p>

    <p>
      Autor: {{ item.autor }}
    </p>

    <p>
      Status: {{ item.status }}
    </p>

    <p>
      Categoria:
      {{ item.categoria || "Não definido" }}
    </p>

    <p>
      Ano: {{ item.ano }}
    </p>

  }
  @else {
    <p>Livro não encontrado.</p>
  }
</main>
